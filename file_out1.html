<!DOCTYPE html>
<html>
<head>
<title>SVG-графика</title>
</head>
<body>
<svg id="pie" width="10000" height="10000">
<title>Expenses</title> <!-- Ось Y с процентами (слева) -->
<g font-size="12" fill="#333">
<text x="30" y="120">100%</text>
<text x="30" y="160">75%</text>
<text x="30" y="200">50%</text>
<text x="30" y="240">25%</text>
<text x="30" y="280">0%</text>
</g>
<!-- Линии горизонтальной сетки (опционально) -->
<g stroke="#ddd" stroke-width="1">
<line x1="40" y1="120" x2="460" y2="120" />
<line x1="40" y1="160" x2="460" y2="160" />
<line x1="40" y1="200" x2="460" y2="200" />
<line x1="40" y1="240" x2="460" y2="240" />
<line x1="40" y1="280" x2="460" y2="280" />
</g>
<!-- Столбцы -->
<g fill="#4e79a7">
<rect x="60"  y="272.8"  width="60" height="7.2" />
<rect x="140"  y="271"  width="60" height="9" />
<rect x="220"  y="262"  width="60" height="18" />
<rect x="300"  y="244"  width="60" height="36" />
<rect x="380"  y="226"  width="60" height="54" />
</g>
<!-- Подписи категорий (снизу) -->
<g font-size="12" fill="#333" text-anchor="middle">
<text x="90"  y="310">A </text>
<text x="170"  y="310">B </text>
<text x="250"  y="310">C </text>
<text x="330"  y="310">D </text>
<text x="410"  y="310">E </text>
</g>

<rect x="20" y="100" width="500" height="220" fill="none" stroke="blue" stroke-width="1" />
<title>Expenses</title>
<g id="rowGroup" transform="translate(0, 0)" role="table">
<rect x="50" y="27" width="500" height="20" fill="gainsboro"/>
<text x="30" y="20" font-size="18px" font-weight="bold" fill="crimson" text-anchor="middle" role="row">
<tspan role="columnheader" x="100">A</tspan>
<tspan role="columnheader" x="200">B</tspan>
<tspan role="columnheader" x="300">C</tspan>
<tspan role="columnheader" x="400">D</tspan>
<tspan role="columnheader" x="500">E</tspan>
</text>
<text x="30" y="42" font-size="18px" font-weight="bold" fill="crimson" text-anchor="middle" role="row">
<tspan role="columnheader" x="100">4</tspan>
<tspan role="columnheader" x="200">5</tspan>
<tspan role="columnheader" x="300">10</tspan>
<tspan role="columnheader" x="400">20</tspan>
<tspan role="columnheader" x="500">30</tspan>

</text><rect x="30" y="5" width="540" height="50" fill="none" stroke="blue" stroke-width="1" />
<rect x="20" y="320" width="260" height="260" fill="none" stroke="blue" stroke-width="1" />
</svg>

<script>
const data = [
{value: 0.057971, color: '#111111', label: 'A'},
{value: 0.0724638, color: '#221111', label: 'B'},
{value: 0.144928, color: '#222211', label: 'C'},
{value: 0.289855, color: '#222222', label: 'D'},
{value: 0.434783, color: '#332222', label: 'E'}
];
const svg = document.getElementById('pie');
const cx = 150, cy = 450, r = 120;
let sum = data.reduce((s, d) => s + d.value, 0);
let startAngle = -Math.PI / 2;
data.forEach((d, i) => {
const angle = (d.value / sum) * 2 * Math.PI;
const endAngle = startAngle + angle;
const x1 = cx + Math.cos(startAngle) * r;
const y1 = cy + Math.sin(startAngle) * r;
const x2 = cx + Math.cos(endAngle) * r;
const y2 = cy + Math.sin(endAngle) * r;
const largeArc = angle > Math.PI ? 1 : 0;
const path = `M ${cx},${cy} L ${x1},${y1} A ${r},${r} 0 ${largeArc},1 ${x2},${y2} Z`;
svg.innerHTML += `<path d="${path}" fill="${d.color}"/>`;
startAngle = endAngle;
});
</script>
</body>
</html>
